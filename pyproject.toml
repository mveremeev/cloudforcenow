[project]
name = "cloudforcenow"
version = "0.1.0"
description = "A pretty TUI for finding, renting and managing Vast.ai GPU machines"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "httpx>=0.27",
]

[project.scripts]
cfn = "cloudforcenow.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cloudforcenow*"]

[tool.setuptools.package-data]
cloudforcenow = ["*.tcss"]
